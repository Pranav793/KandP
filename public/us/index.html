<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Us &bull; K &amp; P</title>
    <meta name="description" content="Our photo gallery — Pranav & Kashika." />
    <link rel="canonical" href="https://kandp.site/us/" />
    <meta property="og:url" content="https://kandp.site/us/" />
    <meta property="og:site_name" content="K & P" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html, body {
        overflow: auto;
      }

      body {
        flex-direction: column;
        padding: 40px 24px 60px;
        gap: 32px;
        min-height: 100%;
        height: auto;
      }

      .gallery-header {
        text-align: center;
        max-width: 600px;
      }

      .gallery-title {
        font-family: var(--font-page);
        font-size: clamp(36px, 6vw, 56px);
        color: var(--ink);
        margin-bottom: 8px;
      }

      .gallery-subtitle {
        font-family: var(--font-page);
        font-size: 18px;
        color: var(--ink-faint);
      }

      .gallery-back {
        display: inline-block;
        margin-top: 12px;
        font-family: var(--font-page);
        font-size: 16px;
        color: var(--accent);
        text-decoration: none;
        transition: color 200ms ease;
      }

      .gallery-back:hover {
        color: var(--ink);
      }

      /* ── Grid ──────────────────────────────────── */

      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 28px;
        width: 100%;
        max-width: 1000px;
      }

      .gallery-empty {
        grid-column: 1 / -1;
        text-align: center;
        padding: 60px 24px;
        border: 2px dashed var(--accent);
        border-radius: var(--radius);
        background: rgba(196, 114, 127, 0.04);
      }

      .gallery-empty-title {
        font-family: var(--font-page);
        font-size: 24px;
        color: var(--accent);
        margin-bottom: 8px;
      }

      .gallery-empty-desc {
        font-family: var(--font-page);
        font-size: 16px;
        color: var(--ink-faint);
      }

      /* ── Polaroid cards ────────────────────────── */

      .polaroid {
        background: var(--page-bg);
        border: 1px solid rgba(0, 0, 0, 0.08);
        padding: 10px 10px 32px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        transition: transform 300ms ease, box-shadow 300ms ease;
        cursor: pointer;
        opacity: 0;
        animation: fade-up 0.5s ease forwards;
      }

      .polaroid:nth-child(3n+1) { transform: rotate(-2deg); }
      .polaroid:nth-child(3n+2) { transform: rotate(1.5deg); }
      .polaroid:nth-child(3n+3) { transform: rotate(-0.5deg); }

      .polaroid:hover {
        transform: rotate(0deg) scale(1.04);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.14);
      }

      .polaroid img {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 5;
        object-fit: cover;
        background: #eee;
        border-radius: 2px;
      }

      .polaroid .caption {
        font-family: var(--font-page);
        font-size: 20px;
        color: var(--ink-light);
        text-align: center;
        margin-top: 10px;
        min-height: 1em;
      }

      @keyframes fade-up {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* stagger the animation per card */
      .polaroid:nth-child(1)  { animation-delay: 0s; }
      .polaroid:nth-child(2)  { animation-delay: 0.06s; }
      .polaroid:nth-child(3)  { animation-delay: 0.12s; }
      .polaroid:nth-child(4)  { animation-delay: 0.18s; }
      .polaroid:nth-child(5)  { animation-delay: 0.24s; }
      .polaroid:nth-child(6)  { animation-delay: 0.30s; }
      .polaroid:nth-child(7)  { animation-delay: 0.36s; }
      .polaroid:nth-child(8)  { animation-delay: 0.42s; }
      .polaroid:nth-child(9)  { animation-delay: 0.48s; }
      .polaroid:nth-child(10) { animation-delay: 0.54s; }

      /* ── Lightbox ──────────────────────────────── */

      .lightbox {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: rgba(0, 0, 0, 0.88);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 250ms ease;
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
      }

      .lightbox.open {
        opacity: 1;
        pointer-events: auto;
      }

      .lightbox img {
        max-width: 90vw;
        max-height: 88vh;
        object-fit: contain;
        border-radius: 6px;
        box-shadow: 0 12px 60px rgba(0, 0, 0, 0.5);
        transition: transform 250ms ease;
      }

      .lightbox .lb-caption {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        font-family: var(--font-page);
        font-size: 18px;
        color: rgba(255, 255, 255, 0.8);
        text-align: center;
        max-width: 80vw;
      }

      .lightbox .lb-close,
      .lightbox .lb-edit,
      .lightbox .lb-delete {
        position: absolute;
        top: 20px;
        width: 40px;
        height: 40px;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 200ms ease;
      }

      .lightbox .lb-close { right: 24px; font-size: 22px; }
      .lightbox .lb-edit  { right: 76px; }
      .lightbox .lb-delete { right: 128px; }

      .lightbox .lb-close:hover,
      .lightbox .lb-edit:hover { background: rgba(255, 255, 255, 0.3); }
      .lightbox .lb-delete:hover { background: rgba(192, 57, 43, 0.5); }

      .lb-caption-editor {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        align-items: center;
        gap: 8px;
        width: 80vw;
        max-width: 500px;
      }

      .lb-caption-editor.active {
        display: flex;
      }

      .lb-caption-editor input {
        flex: 1;
        font-family: var(--font-page);
        font-size: 18px;
        padding: 8px 14px;
        border: none;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.95);
        color: var(--ink);
        outline: none;
      }

      .lb-caption-editor button {
        font-family: var(--font-page);
        font-size: 16px;
        padding: 8px 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 200ms ease;
      }

      .lb-caption-save {
        background: var(--accent);
        color: #fff;
      }
      .lb-caption-save:hover { background: #b5616e; }

      .lb-caption-cancel-btn {
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
      }
      .lb-caption-cancel-btn:hover { background: rgba(255, 255, 255, 0.35); }

      /* ── Password prompt (shared) ───────────────── */

      .pw-prompt {
        position: fixed;
        inset: 0;
        z-index: 300;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 200ms ease;
      }

      .pw-prompt.open {
        opacity: 1;
        pointer-events: auto;
      }

      .pw-prompt-box {
        background: var(--page-bg);
        border-radius: 14px;
        padding: 28px;
        width: 90vw;
        max-width: 320px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        text-align: center;
      }

      .pw-prompt-box h3 {
        font-family: var(--font-page);
        font-size: 22px;
        color: var(--ink);
        font-weight: normal;
      }

      .pw-prompt-box input {
        font-family: var(--font-page);
        font-size: 18px;
        padding: 10px 14px;
        border: 1.5px solid rgba(0, 0, 0, 0.12);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        outline: none;
        text-align: center;
      }

      .pw-prompt-box input:focus { border-color: var(--accent); }

      .pw-prompt-error {
        font-family: var(--font-page);
        font-size: 14px;
        color: #c0392b;
        min-height: 1.2em;
      }

      .pw-prompt-actions {
        display: flex;
        gap: 10px;
        justify-content: center;
      }

      .pw-prompt-actions button {
        font-family: var(--font-page);
        font-size: 16px;
        padding: 8px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      .pw-prompt-ok {
        background: var(--accent);
        color: #fff;
      }
      .pw-prompt-cancel {
        background: transparent;
        color: var(--ink-faint);
      }

      .lightbox .lb-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 44px;
        height: 44px;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        font-size: 22px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 200ms ease;
      }

      .lightbox .lb-nav:hover {
        background: rgba(255, 255, 255, 0.3);
      }

      .lb-prev { left: 16px; }
      .lb-next { right: 16px; }

      /* ── Upload FAB ────────────────────────────── */

      .upload-fab {
        position: fixed;
        bottom: 28px;
        right: 28px;
        z-index: 50;
        width: 56px;
        height: 56px;
        border: none;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        font-size: 28px;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(196, 114, 127, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 200ms ease, box-shadow 200ms ease;
      }

      .upload-fab:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 28px rgba(196, 114, 127, 0.55);
      }

      /* ── Upload Modal ───────────────────────────── */

      .upload-overlay {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 250ms ease;
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
      }

      .upload-overlay.open {
        opacity: 1;
        pointer-events: auto;
      }

      .upload-modal {
        background: var(--page-bg);
        border-radius: 16px;
        padding: 32px;
        width: 90vw;
        max-width: 420px;
        box-shadow: 0 16px 60px rgba(0, 0, 0, 0.25);
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .upload-modal h2 {
        font-family: var(--font-page);
        font-size: 28px;
        color: var(--ink);
        text-align: center;
        font-weight: normal;
      }

      .upload-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .upload-field label {
        font-family: var(--font-page);
        font-size: 16px;
        color: var(--ink-light);
      }

      .upload-field input[type="text"],
      .upload-field input[type="password"] {
        font-family: var(--font-page);
        font-size: 18px;
        padding: 10px 14px;
        border: 1.5px solid rgba(0, 0, 0, 0.12);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        outline: none;
        transition: border-color 200ms ease;
      }

      .upload-field input:focus {
        border-color: var(--accent);
      }

      .upload-file-picker {
        position: relative;
        border: 2px dashed rgba(0, 0, 0, 0.12);
        border-radius: 10px;
        padding: 28px 16px;
        text-align: center;
        cursor: pointer;
        transition: border-color 200ms ease, background 200ms ease;
        overflow: hidden;
      }

      .upload-file-picker:hover,
      .upload-file-picker.has-file {
        border-color: var(--accent);
        background: rgba(196, 114, 127, 0.04);
      }

      .upload-file-picker input {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
      }

      .upload-file-label {
        font-family: var(--font-page);
        font-size: 16px;
        color: var(--ink-faint);
        pointer-events: none;
      }

      .upload-preview {
        max-width: 100%;
        max-height: 180px;
        object-fit: contain;
        border-radius: 6px;
        display: none;
        margin: 0 auto;
      }

      .upload-actions {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
      }

      .upload-btn {
        font-family: var(--font-page);
        font-size: 18px;
        padding: 10px 24px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 200ms ease, transform 150ms ease;
      }

      .upload-btn-cancel {
        background: transparent;
        color: var(--ink-faint);
      }

      .upload-btn-cancel:hover {
        color: var(--ink);
      }

      .upload-btn-submit {
        background: var(--accent);
        color: #fff;
      }

      .upload-btn-submit:hover {
        background: #b5616e;
        transform: scale(1.03);
      }

      .upload-btn-submit:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .upload-error {
        font-family: var(--font-page);
        font-size: 15px;
        color: #c0392b;
        text-align: center;
        min-height: 1.2em;
      }

      /* ── Responsive ────────────────────────────── */

      @media (max-width: 580px) {
        body { padding: 24px 16px 48px; gap: 24px; }

        .gallery-grid {
          grid-template-columns: 1fr 1fr;
          gap: 16px;
        }

        .polaroid {
          padding: 6px 6px 22px;
        }

        .polaroid .caption {
          font-size: 13px;
          margin-top: 6px;
        }

        .lightbox .lb-nav {
          width: 36px;
          height: 36px;
          font-size: 18px;
        }

        .lb-prev { left: 8px; }
        .lb-next { right: 8px; }

        .upload-fab {
          bottom: 20px;
          right: 20px;
          width: 48px;
          height: 48px;
          font-size: 24px;
        }

        .lightbox .lb-close,
        .lightbox .lb-edit,
        .lightbox .lb-delete {
          width: 34px;
          height: 34px;
          font-size: 15px;
          top: 14px;
        }
        .lightbox .lb-close { right: 14px; font-size: 18px; }
        .lightbox .lb-edit  { right: 56px; }
        .lightbox .lb-delete { right: 98px; }

        .lb-caption-editor { width: 92vw; }
        .lb-caption-editor input { font-size: 16px; }
        .lb-caption-editor button { font-size: 14px; padding: 8px 12px; }

        .upload-modal {
          padding: 24px;
          gap: 16px;
        }
      }
    </style>
  </head>
  <body>

    <div class="gallery-header">
      <div class="gallery-title">Us</div>
      <div class="gallery-subtitle">Our photos, all in one place.</div>
      <a class="gallery-back" href="../">&larr; back to the notebook</a>
    </div>

    <div class="gallery-grid" id="grid"></div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
      <button class="lb-delete" aria-label="Delete">&#128465;</button>
      <button class="lb-edit" aria-label="Edit caption">&#9998;</button>
      <button class="lb-close" aria-label="Close">&times;</button>
      <button class="lb-nav lb-prev" aria-label="Previous">&lsaquo;</button>
      <img src="" alt="" />
      <button class="lb-nav lb-next" aria-label="Next">&rsaquo;</button>
      <div class="lb-caption"></div>
      <div class="lb-caption-editor" id="captionEditor">
        <input type="text" id="captionEditorInput" placeholder="new caption..." />
        <button class="lb-caption-save" id="captionEditorSave">save</button>
        <button class="lb-caption-cancel-btn" id="captionEditorCancel">cancel</button>
      </div>
    </div>

    <!-- Password prompt -->
    <div class="pw-prompt" id="pwPrompt">
      <div class="pw-prompt-box">
        <h3 id="pwPromptTitle">enter password</h3>
        <input type="password" id="pwPromptInput" placeholder="you know the one" autocomplete="off" />
        <div class="pw-prompt-error" id="pwPromptError"></div>
        <div class="pw-prompt-actions">
          <button class="pw-prompt-cancel" id="pwPromptCancel">cancel</button>
          <button class="pw-prompt-ok" id="pwPromptOk">ok</button>
        </div>
      </div>
    </div>

    <!-- Upload FAB -->
    <button class="upload-fab" id="uploadFab" aria-label="Add photo">+</button>

    <!-- Upload Modal -->
    <div class="upload-overlay" id="uploadOverlay">
      <div class="upload-modal">
        <h2>add a memory</h2>

        <div class="upload-field">
          <div class="upload-file-picker" id="filePicker">
            <input type="file" id="fileInput" accept="image/jpeg,image/png,image/gif,image/webp,image/avif" />
            <img class="upload-preview" id="uploadPreview" alt="Preview" />
            <div class="upload-file-label" id="fileLabel">tap to choose a photo</div>
          </div>
        </div>

        <div class="upload-field">
          <label for="captionInput">caption</label>
          <input type="text" id="captionInput" placeholder="what's happening here?" autocomplete="off" />
        </div>

        <div class="upload-field">
          <label for="passwordInput">password</label>
          <input type="password" id="passwordInput" placeholder="you know the one" autocomplete="off" />
        </div>

        <div class="upload-error" id="uploadError"></div>

        <div class="upload-actions">
          <button class="upload-btn upload-btn-cancel" id="uploadCancel">cancel</button>
          <button class="upload-btn upload-btn-submit" id="uploadSubmit" disabled>upload</button>
        </div>
      </div>
    </div>

    <script>
      const R2 = "/img";
      const grid = document.getElementById("grid");
      const lightbox = document.getElementById("lightbox");
      const lbImg = lightbox.querySelector("img");
      const lbCaption = lightbox.querySelector(".lb-caption");
      let photos = [];
      let lbIndex = 0;

      function createCard(p, i) {
        const src = typeof p === "string" ? p : p.src;
        const caption = (typeof p === "object" && p.caption) || "";
        const card = document.createElement("div");
        card.className = "polaroid";
        card.innerHTML =
          `<img src="${R2}/${src}" alt="${caption || "Photo " + (i + 1)}" loading="lazy" />` +
          `<div class="caption">${caption}</div>`;
        card.addEventListener("click", () => openLightbox(i));
        return card;
      }

      async function init() {
        try {
          photos = await fetch("/api/photos").then((r) => r.json());
        } catch {
          photos = [];
        }

        if (!photos.length) {
          grid.innerHTML =
            `<div class="gallery-empty">` +
            `<div class="gallery-empty-title">memories go here</div>` +
            `<div class="gallery-empty-desc">Upload your first photo with the + button.</div>` +
            `</div>`;
          return;
        }

        photos.forEach((p, i) => grid.appendChild(createCard(p, i)));
      }

      /* ── Lightbox ─────────────────────────────── */

      function openLightbox(index) {
        lbIndex = index;
        updateLightbox();
        lightbox.classList.add("open");
      }

      function closeLightbox() {
        lightbox.classList.remove("open");
        closeCaptionEditor();
      }

      function updateLightbox() {
        const p = photos[lbIndex];
        const src = typeof p === "string" ? p : p.src;
        const caption = (typeof p === "object" && p.caption) || "";
        lbImg.src = `${R2}/${src}`;
        lbImg.alt = caption || `Photo ${lbIndex + 1}`;
        lbCaption.textContent = caption;
      }

      function lbPrev() {
        lbIndex = (lbIndex - 1 + photos.length) % photos.length;
        updateLightbox();
      }

      function lbNext() {
        lbIndex = (lbIndex + 1) % photos.length;
        updateLightbox();
      }

      lightbox.querySelector(".lb-close").addEventListener("click", closeLightbox);
      lightbox.querySelector(".lb-prev").addEventListener("click", lbPrev);
      lightbox.querySelector(".lb-next").addEventListener("click", lbNext);
      lightbox.addEventListener("click", (e) => { if (e.target === lightbox) closeLightbox(); });

      document.addEventListener("keydown", (e) => {
        if (pwPrompt.classList.contains("open")) {
          if (e.key === "Escape") cancelPwPrompt();
          if (e.key === "Enter") pwPromptOk.click();
          return;
        }
        if (captionEditor.classList.contains("active")) {
          if (e.key === "Escape") closeCaptionEditor();
          if (e.key === "Enter") captionEditorSave.click();
          return;
        }
        if (lightbox.classList.contains("open")) {
          if (e.key === "Escape") closeLightbox();
          if (e.key === "ArrowLeft") lbPrev();
          if (e.key === "ArrowRight") lbNext();
          return;
        }
        if (uploadOverlay.classList.contains("open") && e.key === "Escape") {
          closeUpload();
        }
      });

      /* ── Password prompt ──────────────────────── */

      const pwPrompt = document.getElementById("pwPrompt");
      const pwPromptInput = document.getElementById("pwPromptInput");
      const pwPromptError = document.getElementById("pwPromptError");
      const pwPromptOk = document.getElementById("pwPromptOk");
      const pwPromptTitle = document.getElementById("pwPromptTitle");
      let cachedPassword = sessionStorage.getItem("kp_pw") || "";
      let pwResolve = null;

      function askPassword(title) {
        if (cachedPassword) return Promise.resolve(cachedPassword);
        return new Promise((resolve) => {
          pwResolve = resolve;
          pwPromptTitle.textContent = title || "enter password";
          pwPromptError.textContent = "";
          pwPromptInput.value = "";
          pwPrompt.classList.add("open");
          setTimeout(() => pwPromptInput.focus(), 100);
        });
      }

      function cancelPwPrompt() {
        pwPrompt.classList.remove("open");
        if (pwResolve) { pwResolve(null); pwResolve = null; }
      }

      document.getElementById("pwPromptCancel").addEventListener("click", cancelPwPrompt);
      pwPrompt.addEventListener("click", (e) => { if (e.target === pwPrompt) cancelPwPrompt(); });

      pwPromptOk.addEventListener("click", () => {
        const pw = pwPromptInput.value;
        if (!pw) { pwPromptError.textContent = "enter the password"; return; }
        cachedPassword = pw;
        sessionStorage.setItem("kp_pw", pw);
        pwPrompt.classList.remove("open");
        if (pwResolve) { pwResolve(pw); pwResolve = null; }
      });

      function clearCachedPassword() {
        cachedPassword = "";
        sessionStorage.removeItem("kp_pw");
      }

      /* ── Edit caption ─────────────────────────── */

      const captionEditor = document.getElementById("captionEditor");
      const captionEditorInput = document.getElementById("captionEditorInput");
      const captionEditorSave = document.getElementById("captionEditorSave");

      function openCaptionEditor() {
        const p = photos[lbIndex];
        const caption = (typeof p === "object" && p.caption) || "";
        captionEditorInput.value = caption;
        lbCaption.style.display = "none";
        captionEditor.classList.add("active");
        setTimeout(() => captionEditorInput.focus(), 50);
      }

      function closeCaptionEditor() {
        captionEditor.classList.remove("active");
        lbCaption.style.display = "";
      }

      document.getElementById("captionEditorCancel").addEventListener("click", closeCaptionEditor);

      lightbox.querySelector(".lb-edit").addEventListener("click", openCaptionEditor);

      captionEditorSave.addEventListener("click", async () => {
        const pw = await askPassword("edit caption");
        if (!pw) return;

        const p = photos[lbIndex];
        const newCaption = captionEditorInput.value.trim();
        captionEditorSave.textContent = "saving...";

        try {
          const res = await fetch(`/api/photos/${encodeURIComponent(p.src)}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ caption: newCaption, password: pw }),
          });
          const data = await res.json();
          if (!res.ok) {
            if (res.status === 401) clearCachedPassword();
            alert(data.error || "failed to save");
            captionEditorSave.textContent = "save";
            return;
          }

          p.caption = newCaption || undefined;
          lbCaption.textContent = newCaption;
          closeCaptionEditor();
          rebuildGrid();
        } catch {
          alert("couldn't reach the server");
        }
        captionEditorSave.textContent = "save";
      });

      /* ── Delete photo ─────────────────────────── */

      lightbox.querySelector(".lb-delete").addEventListener("click", async () => {
        if (!confirm("delete this photo?")) return;

        const pw = await askPassword("delete photo");
        if (!pw) return;

        const p = photos[lbIndex];

        try {
          const res = await fetch(`/api/photos/${encodeURIComponent(p.src)}`, {
            method: "DELETE",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: pw }),
          });
          const data = await res.json();
          if (!res.ok) {
            if (res.status === 401) clearCachedPassword();
            alert(data.error || "failed to delete");
            return;
          }

          photos.splice(lbIndex, 1);
          closeLightbox();
          rebuildGrid();
        } catch {
          alert("couldn't reach the server");
        }
      });

      function rebuildGrid() {
        grid.innerHTML = "";
        if (!photos.length) {
          grid.innerHTML =
            `<div class="gallery-empty">` +
            `<div class="gallery-empty-title">memories go here</div>` +
            `<div class="gallery-empty-desc">Upload your first photo with the + button.</div>` +
            `</div>`;
          return;
        }
        photos.forEach((p, i) => grid.appendChild(createCard(p, i)));
      }

      /* ── Upload modal ─────────────────────────── */

      const uploadOverlay = document.getElementById("uploadOverlay");
      const fileInput = document.getElementById("fileInput");
      const filePicker = document.getElementById("filePicker");
      const fileLabel = document.getElementById("fileLabel");
      const uploadPreview = document.getElementById("uploadPreview");
      const captionInput = document.getElementById("captionInput");
      const passwordInput = document.getElementById("passwordInput");
      const uploadError = document.getElementById("uploadError");
      const uploadSubmit = document.getElementById("uploadSubmit");

      document.getElementById("uploadFab").addEventListener("click", () => {
        uploadOverlay.classList.add("open");
      });

      document.getElementById("uploadCancel").addEventListener("click", closeUpload);

      uploadOverlay.addEventListener("click", (e) => {
        if (e.target === uploadOverlay) closeUpload();
      });

      function closeUpload() {
        uploadOverlay.classList.remove("open");
        fileInput.value = "";
        captionInput.value = "";
        passwordInput.value = "";
        uploadError.textContent = "";
        uploadPreview.style.display = "none";
        fileLabel.style.display = "";
        filePicker.classList.remove("has-file");
        uploadSubmit.disabled = true;
      }

      fileInput.addEventListener("change", () => {
        const file = fileInput.files[0];
        if (!file) return;
        fileLabel.style.display = "none";
        uploadPreview.style.display = "block";
        uploadPreview.src = URL.createObjectURL(file);
        filePicker.classList.add("has-file");
        uploadSubmit.disabled = false;
      });

      uploadSubmit.addEventListener("click", async () => {
        const file = fileInput.files[0];
        if (!file) return;

        const pw = passwordInput.value;
        if (!pw) {
          uploadError.textContent = "enter the password";
          return;
        }

        uploadError.textContent = "";
        uploadSubmit.disabled = true;
        uploadSubmit.textContent = "uploading...";

        try {
          const form = new FormData();
          form.append("image", file);
          form.append("caption", captionInput.value.trim());
          form.append("password", pw);

          const res = await fetch("/api/photos", { method: "POST", body: form });
          const data = await res.json();

          if (!res.ok) {
            uploadError.textContent = data.error || "something went wrong";
            uploadSubmit.disabled = false;
            uploadSubmit.textContent = "upload";
            return;
          }

          // Clear the "empty" placeholder if present
          const empty = grid.querySelector(".gallery-empty");
          if (empty) empty.remove();

          photos.push(data);
          const card = createCard(data, photos.length - 1);
          grid.appendChild(card);
          closeUpload();
        } catch {
          uploadError.textContent = "couldn't reach the server";
          uploadSubmit.disabled = false;
        }
        uploadSubmit.textContent = "upload";
      });

      init();
    </script>
  </body>
</html>
